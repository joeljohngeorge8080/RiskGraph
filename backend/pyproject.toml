[project]
name = "riskgraph"
version = "0.1.0"
description = "Context-aware security risk prioritization and attack-path analysis platform"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "structlog>=24.1",
  "httpx>=0.27",
  "pyyaml>=6.0",  # riskgraph.yaml manifest; already installed via uvicorn[standard]
  "tree-sitter>=0.24",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "networkx>=3.3",
  "docker>=7.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "celery-types>=0.22",
  "types-networkx>=3.6.1.20261021",
  # starlette.testclient prefers httpx2 and warns on httpx; pinned to a release >2 weeks old
  "httpx2==2.13.1",
]

[tool.uv]
# httpx2's transitive truststore 0.10.5 is under 2 weeks old; hold the previous release
constraint-dependencies = ["truststore<0.10.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riskgraph"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["riskgraph", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "T20"]
ignore = ["S104"]  # binding 0.0.0.0 is intentional inside containers

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E501"]
"evaluation/scenarios.py" = ["E501"]  # manifest templates are YAML text

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["riskgraph", "tests", "evaluation"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "yaml.*", "docker", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "db: needs PostgreSQL and Redis (compose test profile)",
  "docker: needs a Docker daemon",
  "security: security regression tests",
  "e2e: full pipeline tests",
  "perf: performance measurements",
  "llm: calls a real local model (Ollama); skipped when it is unreachable",
]
filterwarnings = ["error::DeprecationWarning:riskgraph.*"]

[tool.coverage.run]
source = ["riskgraph"]
branch = true
