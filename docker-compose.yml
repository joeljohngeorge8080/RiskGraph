# RiskGraph local development stack. `make dev` == `docker compose up --build`.
name: riskgraph

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
    target: runtime
  env_file: .env
  environment:
    RISKGRAPH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-riskgraph}:${POSTGRES_PASSWORD:-riskgraph}@postgres:5432/${POSTGRES_DB:-riskgraph}
    RISKGRAPH_REDIS_URL: redis://:${REDIS_PASSWORD:-riskgraph}@redis:6379/0
  volumes:                       # source-only mounts: the image's /app/.venv must stay intact
    - ./backend/riskgraph:/app/riskgraph:ro
    - ./backend/alembic:/app/alembic:ro
    - ./backend/alembic.ini:/app/alembic.ini:ro
    - ./backend/tests:/app/tests:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riskgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskgraph}
      POSTGRES_DB: ${POSTGRES_DB:-riskgraph}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskgraph} -d ${POSTGRES_DB:-riskgraph}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-riskgraph}", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-riskgraph} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    command: ["uvicorn", "--factory", "riskgraph.entrypoints.api:create_app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]   # MVP has no auth: never publish beyond localhost
    volumes:
      - ./backend/riskgraph:/app/riskgraph:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/tests:/app/tests:ro
      - riskgraph_data:/var/lib/riskgraph:ro      # stored reports, for downloads
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: worker
    volumes:
      - ./backend/riskgraph:/app/riskgraph:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/tests:/app/tests:ro
      - riskgraph_data:/var/lib/riskgraph          # workspaces + stored reports
      - trivy_cache:/var/cache/riskgraph/trivy
    command: ["celery", "-A", "riskgraph.entrypoints.worker:celery_app", "worker", "-Q", "scan,analysis", "--concurrency", "2", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "celery -A riskgraph.entrypoints.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    <<: *backend
    command: ["celery", "-A", "riskgraph.entrypoints.worker:celery_app", "beat", "--loglevel", "INFO", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      disable: true            # beat serves nothing; liveness is "process running"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:5173"]
    depends_on: [api]

volumes:
  pgdata:
  frontend_node_modules:
  riskgraph_data:
  trivy_cache:
